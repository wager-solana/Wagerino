<!doctype html><html><head><meta charset="utf-8"><title>Coin Flip skin</title>
<style>
html,body{margin:0;background:transparent;color:#e6e8fa;font:14px/1.4 Nunito,system-ui,sans-serif;height:100%}
.wrap{height:100%;display:grid;place-items:center;grid-template-rows:1fr auto}
.coin{width:280px;height:280px;border-radius:50%;position:relative;transform-style:preserve-3d;transition:transform 1.8s cubic-bezier(.2,.8,.3,1)}
.coin.spin{animation:spin .6s linear infinite}@keyframes spin{to{transform:rotateY(360deg)}}
.f{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;backface-visibility:hidden;font-size:110px;box-shadow:inset 0 -14px 30px rgba(0,0,0,.25)}
.h{background:radial-gradient(circle at 35% 30%,#ffd37a,#f2a93b 60%,#b8791f)}.t{background:radial-gradient(circle at 35% 30%,#7fe6b0,#2fd37a 60%,#1e9c58);transform:rotateY(180deg)}
.side{display:flex;gap:10px;margin-bottom:18px}.side button{background:#1c2050;border:2px solid transparent;color:#fff;border-radius:8px;padding:12px 26px;font-weight:800;cursor:pointer}.side button.on{border-color:#ee6b3b}
.msg{position:absolute;top:16px;left:0;right:0;text-align:center;font-weight:900;font-size:26px}
</style></head><body>
<div class="wrap"><div class="msg" id="msg"></div><div class="coin" id="coin"><div class="f h">★</div><div class="f t">♛</div></div>
<div class="side"><button id="heads" class="on">Heads ★</button><button id="tails">Tails ♛</button></div></div>
<script src="/skins/wagerino-skin.js"></script>
<script>
// Side is cosmetic: the on-chain row is win or lose. The coin lands on your side when you win.
let side = "heads", rot = 0; const coin = document.getElementById("coin"), msg = document.getElementById("msg");
for (const s of ["heads", "tails"]) document.getElementById(s).onclick = () => { side = s; document.getElementById("heads").classList.toggle("on", s === "heads"); document.getElementById("tails").classList.toggle("on", s === "tails"); land(s, 0); };
function land(face, spins) { coin.classList.remove("spin"); rot = rot - (rot % 360) + spins * 360 + (face === "tails" ? 180 : 0); coin.style.transform = `rotateY(${rot}deg)`; }
WagerinoSkin.on("init", ({ game }) => { msg.textContent = ""; })
  .on("bet_placed", () => { msg.textContent = ""; coin.style.transform = ""; coin.classList.add("spin"); })
  .on("result", ({ multBps, payout }) => { const won = multBps > 0; land(won ? side : side === "heads" ? "tails" : "heads", 5);
    setTimeout(() => { msg.textContent = won ? `${(multBps / 10000).toFixed(2)}× · +${(payout / 1e6).toFixed(2)} USDC` : "Bust"; msg.style.color = won ? "#2fd37a" : "#ff4d6d"; WagerinoSkin.done(); }, 1900); })
  .on("reset", () => { msg.textContent = ""; });
WagerinoSkin.ready({ playerPaced: false });
</script></body></html>
